#
# this file is used to create vslib.a library makefile
#

MM_RESTART = 1

CC  = g++
LD  = g++
AR  = ar rv
RANLIB = ranlib
LD  = g++

############################################################################
# make vstring.a

#MODULES = pcre2

[vstring.a]

# DEFAULT = 1

CCFLAGS = -I. -O3 -Wpedantic -Wextra -Wformat -Werror=format-security -Wdate-time -D_FORTIFY_SOURCE=2 $(CFLAGS) $(CPPFLAGS) $(CCDEF)
LDFLAGS = $(LDFLAGS) $(LDDEF)
TARGET  = libvstring.a
SRC     = vref.cpp vstring.cpp vstrlib.cpp wstring.cpp wstrlib.cpp vstruti.cpp

[test:vstring.a]

CC      = g++
LD      = g++
CCFLAGS = -I. -O3 -g -Wpedantic -Wextra -Wformat -Werror=format-security -Wdate-time -D_FORTIFY_SOURCE=2 $(CFLAGS) $(CPPFLAGS) $(CCDEF)
LDFLAGS = -L. -lvstring -lpcre2-8 -lpcre2-32 $(LDFLAGS) $(LDDEF)
TARGET  = test
SRC    += test.cpp

[wtest:vstring.a]

CC      = g++
LD      = g++
CCFLAGS = -I. -O0 -g -Wpedantic -Wextra -Wformat -Werror=format-security -Wdate-time -D_FORTIFY_SOURCE=2 $(CFLAGS) $(CPPFLAGS) $(CCDEF)
LDFLAGS = -L. -lvstring -lpcre2-8 -lpcre2-32 $(LDFLAGS) $(LDDEF)
TARGET  = wtest
SRC    += wtest.cpp

[test_sfn:vstring.a]

# full debug info, no optimisation -- so that the library sources compiled
# into this target can be stepped through and inspected in the debugger

CC      = g++
LD      = g++
CCFLAGS = -I. -O0 -ggdb3 -fno-omit-frame-pointer -Wpedantic -Wextra -Wformat -Werror=format-security -Wdate-time -D_FORTIFY_SOURCE=2 $(CFLAGS) $(CPPFLAGS) $(CCDEF)
LDFLAGS = -ggdb3 -L. -lvstring -lpcre2-8 -lpcre2-32 $(LDFLAGS) $(LDDEF)
TARGET  = test_sfn
SRC    += test_sfn.cpp

